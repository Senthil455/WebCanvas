<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Flip Card</title>
    <link rel="stylesheet" href="style.css" />
  </head>
  <body>
    <p>Hover the card to flip it</p>
    <div class="scene">
      <div class="card">
        <div class="face front">
          <h1>Front</h1>
        </div>
        <div class="face back">
          <h1>Back</h1>
          <span>Rotated 180&deg;</span>
        </div>
      </div>
    </div>
  </body>
</html>
