<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Radio Buttons</title>
    <link rel="stylesheet" href="style.css" />
  </head>
  <body>
    <p>Selectable option cards</p>
    <div class="options">
      <label class="option">
        <input type="radio" name="plan" value="basic" checked />
        <span class="dot"></span>
        <span class="text"><b>Basic</b>One project, community support</span>
      </label>
      <label class="option">
        <input type="radio" name="plan" value="pro" />
        <span class="dot"></span>
        <span class="text"><b>Pro</b>Unlimited projects, priority support</span>
      </label>
      <label class="option">
        <input type="radio" name="plan" value="team" />
        <span class="dot"></span>
        <span class="text"><b>Team</b>Everything in Pro, shared workspace</span>
      </label>
    </div>
  </body>
</html>
