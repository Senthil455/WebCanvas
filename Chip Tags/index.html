<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Chip Tags</title>
    <link rel="stylesheet" href="style.css" />
  </head>
  <body>
    <p>Compact tags with an active state</p>
    <div class="chips">
      <span class="chip active">HTML</span>
      <span class="chip">CSS</span>
      <span class="chip">JavaScript</span>
      <span class="chip">Flexbox</span>
      <span class="chip removable">Grid <b>&times;</b></span>
    </div>
  </body>
</html>
