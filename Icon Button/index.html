<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Icon Button</title>
    <link rel="stylesheet" href="style.css" />
  </head>
  <body>
    <p>Round buttons with a tooltip label</p>
    <div class="icons">
      <button class="icon" aria-label="Add">+</button>
      <button class="icon" aria-label="Share">&#8599;</button>
      <button class="icon" aria-label="Download">&#8595;</button>
      <button class="icon" aria-label="Delete">&#10005;</button>
    </div>
  </body>
</html>
