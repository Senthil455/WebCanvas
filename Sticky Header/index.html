<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Sticky Header</title>
    <link rel="stylesheet" href="style.css" />
  </head>
  <body>
    <p>The header stays while the page scrolls</p>
    <header class="header">
      <span class="brand">WebCanvas</span>
      <nav><a href="#">Demos</a><a href="#">About</a></nav>
    </header>
    <main class="content">
      <section class="block">Scroll down to see the header stay put.</section>
      <section class="block">The header is pinned above this section.</section>
      <section class="block">And above this one too.</section>
    </main>
  </body>
</html>
