<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>File Upload</title>
    <link rel="stylesheet" href="style.css" />
  </head>
  <body>
    <p>A clickable drop zone</p>
    <label class="drop">
      <input type="file" />
      <span class="icon">&#8593;</span>
      <span class="title">Choose a file or drop it here</span>
      <span class="hint">PNG, JPG or SVG up to 5 MB</span>
    </label>
  </body>
</html>
