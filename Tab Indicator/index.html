<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Tab Indicator</title>
    <link rel="stylesheet" href="style.css" />
  </head>
  <body>
    <p>Tabs with a sliding underline</p>
    <div class="tabs">
      <input type="radio" name="tab" id="tab-one" checked />
      <input type="radio" name="tab" id="tab-two" />
      <input type="radio" name="tab" id="tab-three" />
      <label for="tab-one">Overview</label>
      <label for="tab-two">Settings</label>
      <label for="tab-three">Billing</label>
    </div>
  </body>
</html>
