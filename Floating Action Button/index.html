<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Floating Action Button</title>
    <link rel="stylesheet" href="style.css" />
  </head>
  <body>
    <p>A round button that reveals actions</p>
    <div class="fab-wrap">
      <div class="fab">
        <button class="main" aria-label="Create">+</button>
        <button class="action" aria-label="New file">&#128196;</button>
        <button class="action" aria-label="New folder">&#128193;</button>
      </div>
    </div>
  </body>
</html>
