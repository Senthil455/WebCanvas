<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Emoji Rating</title>
    <link rel="stylesheet" href="style.css" />
  </head>
  <body>
    <p>Pick a face to rate the page</p>
    <fieldset class="rating">
      <legend>How was it?</legend>
      <label>
        <input type="radio" name="mood" value="1" />
        <span class="face">&#128542;</span>
      </label>
      <label>
        <input type="radio" name="mood" value="2" />
        <span class="face">&#128528;</span>
      </label>
      <label>
        <input type="radio" name="mood" value="3" />
        <span class="face">&#128578;</span>
      </label>
      <label>
        <input type="radio" name="mood" value="4" />
        <span class="face">&#128512;</span>
      </label>
      <label>
        <input type="radio" name="mood" value="5" />
        <span class="face">&#129321;</span>
      </label>
    </fieldset>
  </body>
</html>
