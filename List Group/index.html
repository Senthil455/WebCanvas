<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>List Group</title>
    <link rel="stylesheet" href="style.css" />
  </head>
  <body>
    <p>A stacked list with an active row</p>
    <ul class="group">
      <li class="item">
        <span>Inbox</span>
        <span class="badge">12</span>
      </li>
      <li class="item active">
        <span>Drafts</span>
        <span class="badge">3</span>
      </li>
      <li class="item">
        <span>Archive</span>
      </li>
    </ul>
  </body>
</html>
