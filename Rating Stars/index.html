<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Rating Stars</title>
    <link rel="stylesheet" href="style.css" />
  </head>
  <body>
    <p>Click a star to set the rating</p>
    <div class="stars" id="stars" role="radiogroup" aria-label="Rating">
      <button data-value="1" aria-label="1 star">&#9733;</button>
      <button data-value="2" aria-label="2 stars">&#9733;</button>
      <button data-value="3" aria-label="3 stars">&#9733;</button>
      <button data-value="4" aria-label="4 stars">&#9733;</button>
      <button data-value="5" aria-label="5 stars">&#9733;</button>
    </div>
    <p class="result" id="result">No rating yet</p>
    <script src="script.js"></script>
  </body>
</html>
