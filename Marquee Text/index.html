<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Marquee Text</title>
    <link rel="stylesheet" href="style.css" />
  </head>
  <body>
    <p>Infinite scrolling ticker</p>
    <div class="marquee">
      <div class="track">
        <span>HTML</span>
        <span>CSS</span>
        <span>JavaScript</span>
        <span>Flexbox</span>
        <span>Grid</span>
        <span>Animations</span>
      </div>
      <div class="track" aria-hidden="true">
        <span>HTML</span>
        <span>CSS</span>
        <span>JavaScript</span>
        <span>Flexbox</span>
        <span>Grid</span>
        <span>Animations</span>
      </div>
    </div>
  </body>
</html>
