<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Stepper</title>
    <link rel="stylesheet" href="style.css" />
  </head>
  <body>
    <p>A three step progress indicator</p>
    <ol class="stepper">
      <li class="done"><span class="circle">1</span>Account</li>
      <li class="active"><span class="circle">2</span>Details</li>
      <li><span class="circle">3</span>Review</li>
    </ol>
  </body>
</html>
