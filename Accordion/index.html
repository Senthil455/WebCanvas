<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Accordion</title>
    <link rel="stylesheet" href="style.css" />
  </head>
  <body>
    <p>Click a row to expand it</p>
    <div class="accordion">
      <details open>
        <summary>What is HTML?</summary>
        <p class="answer">The markup language that gives a page its structure.</p>
      </details>
      <details>
        <summary>What is CSS?</summary>
        <p class="answer">The language that handles colour, spacing and motion.</p>
      </details>
      <details>
        <summary>What is JavaScript?</summary>
        <p class="answer">The scripting language that adds behaviour to the page.</p>
      </details>
    </div>
  </body>
</html>
