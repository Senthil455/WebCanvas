<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Live Character Counter</title>
    <link rel="stylesheet" href="style.css" />
  </head>
  <body>
    <p>Counts what you type as you type it</p>
    <div class="composer">
      <textarea id="text" maxlength="120" placeholder="What is on your mind?"></textarea>
      <div class="meta">
        <span id="count">0 / 120</span>
        <button type="button">Post</button>
      </div>
    </div>
    <script src="script.js"></script>
  </body>
</html>
