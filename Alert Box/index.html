<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Alert Box</title>
    <link rel="stylesheet" href="style.css" />
  </head>
  <body>
    <p>Four status messages</p>
    <div class="alerts">
      <div class="alert info"><strong>Info</strong>Your changes were saved automatically.</div>
      <div class="alert success"><strong>Success</strong>The file finished uploading.</div>
      <div class="alert warning"><strong>Warning</strong>Your session expires in five minutes.</div>
      <div class="alert danger"><strong>Error</strong>We could not reach the server.</div>
    </div>
  </body>
</html>
