<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Timeline</title>
    <link rel="stylesheet" href="style.css" />
  </head>
  <body>
    <p>Events on a vertical line</p>
    <ol class="timeline">
      <li>
        <span class="dot"></span>
        <span class="time">09:00</span>
        <h3>Kick off</h3>
        <p>Sketch the layout and pick the palette.</p>
      </li>
      <li>
        <span class="dot"></span>
        <span class="time">12:30</span>
        <h3>Build</h3>
        <p>Write the markup and style each section.</p>
      </li>
      <li>
        <span class="dot"></span>
        <span class="time">16:00</span>
        <h3>Ship</h3>
        <p>Check it in the browser and open a pull request.</p>
      </li>
    </ol>
  </body>
</html>
