<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Animated Checkbox</title>
    <link rel="stylesheet" href="style.css" />
  </head>
  <body>
    <p>Tick the box to see the check draw in</p>
    <label class="check">
      <input type="checkbox" checked />
      <span class="box"></span>
      <span class="text">Subscribe to the newsletter</span>
    </label>
  </body>
</html>
