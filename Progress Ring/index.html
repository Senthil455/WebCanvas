<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Progress Ring</title>
    <link rel="stylesheet" href="style.css" />
  </head>
  <body>
    <p>A conic gradient ring with a value</p>
    <div class="rings">
      <div class="ring" style="--value: 72"><span>72%</span></div>
      <div class="ring small" style="--value: 38"><span>38%</span></div>
    </div>
  </body>
</html>
