<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Flexbox Gallery</title>
    <link rel="stylesheet" href="style.css" />
  </head>
  <body>
    <p>Resize the window to see the gallery reflow</p>
    <div class="gallery">
      <div class="tile">1</div>
      <div class="tile wide">2</div>
      <div class="tile">3</div>
      <div class="tile tall">4</div>
      <div class="tile">5</div>
      <div class="tile wide">6</div>
    </div>
  </body>
</html>
