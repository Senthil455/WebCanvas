<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Split Button</title>
    <link rel="stylesheet" href="style.css" />
  </head>
  <body>
    <p>A primary action with a menu</p>
    <div class="split">
      <button class="main">Save</button>
      <button class="caret" aria-label="More save options">&#9662;</button>
      <ul class="menu">
        <li>Save as draft</li>
        <li>Save and close</li>
        <li>Duplicate</li>
      </ul>
    </div>
  </body>
</html>
