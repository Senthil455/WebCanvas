<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Card Grid</title>
    <link rel="stylesheet" href="style.css" />
  </head>
  <body>
    <p>Three cards that reflow on resize</p>
    <div class="grid">
      <article class="card">
        <h3>Speed</h3>
        <p>Ship the small things first and keep the page light.</p>
      </article>
      <article class="card">
        <h3>Clarity</h3>
        <p>One idea per card keeps the grid easy to scan.</p>
      </article>
      <article class="card">
        <h3>Rhythm</h3>
        <p>Consistent spacing does most of the design work.</p>
      </article>
    </div>
  </body>
</html>
