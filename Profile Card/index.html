<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Profile Card</title>
    <link rel="stylesheet" href="style.css" />
  </head>
  <body>
    <p>An avatar, a bio and follower stats</p>
    <article class="profile">
      <div class="avatar">AK</div>
      <h3>Ada Keller</h3>
      <span class="role">Frontend developer</span>
      <p class="bio">Building small, sharp interfaces one folder at a time.</p>
      <div class="stats">
        <span><b>128</b> followers</span>
        <span><b>76</b> demos</span>
      </div>
      <button>Follow</button>
    </article>
  </body>
</html>
