<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Testimonial Card</title>
    <link rel="stylesheet" href="style.css" />
  </head>
  <body>
    <p>A quote from a happy customer</p>
    <figure class="testimonial">
      <div class="stars">&#9733;&#9733;&#9733;&#9733;&#9733;</div>
      <blockquote>I rebuilt my whole landing page with these demos in one evening.</blockquote>
      <figcaption>
        <span class="avatar">MR</span>
        <span class="who">
          <b>Mia Rossi</b>
          <span>Product designer</span>
        </span>
      </figcaption>
    </figure>
  </body>
</html>
