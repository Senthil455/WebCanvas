<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Stats Counter</title>
    <link rel="stylesheet" href="style.css" />
  </head>
  <body>
    <p>Numbers that count up on load</p>
    <div class="stats">
      <div class="stat">
        <span class="value" data-target="128">0</span>
        <span class="label">Demos</span>
      </div>
      <div class="stat">
        <span class="value" data-target="64">0</span>
        <span class="label">Contributors</span>
      </div>
      <div class="stat">
        <span class="value" data-target="99">0</span>
        <span class="label">Commits</span>
      </div>
    </div>
    <script src="script.js"></script>
  </body>
</html>
